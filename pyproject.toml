[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "substation"
version = "0.1.0"
description = "SUBstation - a basic digital audio workstation (Python UI, C++ audio engine)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff"]

[project.gui-scripts]
substation = "substation.app:main"

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.26"
cmake.build-type = "Release"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/substation"]

[tool.pytest.ini_options]
testpaths = ["tests"]
